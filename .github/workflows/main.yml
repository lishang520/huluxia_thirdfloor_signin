name: huluxia_signin

on:
  schedule:        # UTC 16:00 = 北京时间次日 00:00
    - cron: '0 16 * * *'
  workflow_dispatch:   # 支持手动触发，部署完先手动跑一次验证

permissions:
  contents: read

concurrency:
  group: huluxia-signin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 初始化 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt

      - name: 开始运行
        id: signin-outputs
        env:
          # 不需要的通知方式直接注释掉；需要哪种就取消注释并配置对应 Secret
          NOTIFIER_TYPE: ${{ secrets.NOTIFIER_TYPE }}
          # EMAIL_CONFIG: ${{ secrets.EMAIL_CONFIG }}
          # WECHAT_ROBOT_URL: ${{ secrets.WECHAT_ROBOT_URL }}
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          TZ: Asia/Shanghai
        run: python ./main.py
